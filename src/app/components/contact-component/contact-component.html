<section class="contact-page">

  <div class="contact-container">

    <!-- LEFT: INTRO -->
    <div class="contact-intro">

      <div class="section-label">
        <span class="line"></span>
        <span>Contact</span>
      </div>

      <h1>Let's build something solid.</h1>

      <p class="intro-text">
        Whether you need a modern web application, a robust backend system,
        or a custom technical solution, I'm open to meaningful collaborations
        and serious projects.
      </p>

      <div class="contact-details">
        <div>
          <h3>Email</h3>
          <a href="mailto:sshadowmonkeyy@gmail.com">sshadowmonkeyy&#64;gmail.com</a>
        </div>
        <div>
          <h3>Location</h3>
          <p>Belgium &mdash; working remotely</p>
        </div>
      </div>

    </div>

    <!-- RIGHT: FORM -->
    <div class="contact-form-wrapper">
      <form class="contact-form">

        <h2>Get in touch</h2>

        <div class="field-row">
          <input type="text" name="firstName" placeholder="First name" required />
          <input type="text" name="lastName" placeholder="Last name" required />
        </div>

        <input type="email" name="email" placeholder="Email address" required />

        <textarea name="message" rows="5" placeholder="Tell me about your project..." required></textarea>

        <button type="submit">Send message</button>

      </form>
    </div>

  </div>

</section>
