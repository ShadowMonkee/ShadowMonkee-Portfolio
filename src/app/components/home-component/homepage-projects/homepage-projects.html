<section class="projects-preview">
  <div class="projects-inner">

    <div class="projects-header">
      <h3>Recent Projects</h3>
      <p class="muted">A selection of full-stack systems I've built for clients and personal work.</p>
    </div>

    <div class="projects-grid">
      <project-card
        *ngFor="let project of projects"
        [title]="project.title"
        [tech]="project.tech"
        [link]="project.link"
        [image]="project.image"
      ></project-card>
    </div>

    <div class="projects-cta">
      <a routerLink="/projects" class="btn-outline">View All Projects</a>
    </div>

  </div>
</section>
