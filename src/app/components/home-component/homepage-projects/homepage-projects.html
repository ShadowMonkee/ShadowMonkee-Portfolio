<section class="projects-preview">
  <div class="projects-inner">

    <div class="projects-header" reveal>
      <span class="section-label-line">Work</span>
      <h2 class="section-title">Recent Projects</h2>
      <p class="section-description">
        A selection of full-stack systems built for clients and personal work.
      </p>
    </div>

    <div class="projects-grid" revealStagger>
      <project-card
        *ngFor="let project of projects"
        [title]="project.title"
        [tech]="project.tech"
        [link]="project.link"
        [image]="project.image"
      ></project-card>
    </div>

    <div class="projects-cta" reveal>
      <a routerLink="/projects" class="btn-outline-primary">
        View all projects
        <span class="cta-arrow">→</span>
      </a>
    </div>

  </div>
</section>
