<div
  class="navbar"
  [class.navbar-scrolled]="isScrolled"
>
  <div class="navbar-inner">

    <a class="navbar-logo" routerLink="/" aria-label="Home">
      <img src="assets/Images/SM.png" alt="ShadowMonkee">
    </a>

    <nav class="desktop-navbar" aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-btn">Home</a>
      <a routerLink="/about-me" routerLinkActive="active" class="nav-btn">About</a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-btn">Projects</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-btn contact-btn">Contact</a>
    </nav>

    <button
      class="hamburger"
      [class.open]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <nav class="mobile-menu" [class.open]="mobileMenuOpen" aria-label="Mobile navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMobileMenu()">Home</a>
    <a routerLink="/about-me" routerLinkActive="active" class="mobile-link" (click)="closeMobileMenu()">About</a>
    <a routerLink="/projects" routerLinkActive="active" class="mobile-link" (click)="closeMobileMenu()">Projects</a>
    <a routerLink="/contact" routerLinkActive="active" class="mobile-link" (click)="closeMobileMenu()">Contact</a>
  </nav>

</div>
