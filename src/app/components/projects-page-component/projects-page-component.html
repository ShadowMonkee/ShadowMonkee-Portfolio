<section class="projects-page">
  <div class="projects-inner">

    <header class="projects-header">
      <h1>Projects</h1>
      <p class="muted">
        Selected professional and personal projects focused on clean architecture,
        performance, and maintainability.
      </p>
    </header>

    <div class="projects-grid">
      <project-card
        *ngFor="let project of projects"
        [title]="project.title"
        [tech]="project.tech"
        [image]="project.image"
        [link]="'/projects/' + project.slug"
      ></project-card>
    </div>

  </div>
</section>
